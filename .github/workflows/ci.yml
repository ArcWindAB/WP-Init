name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        wordpress: ['6.8', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli, zip
      - name: Install development checks
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lint and regression tests
        run: |
          find arcwind-init.php includes tests -name '*.php' -print0 | xargs -0 -n1 php -l
          composer cs
          composer analyse
          php tests/oneuptime-dates.php
          php tests/oneuptime-responses.php
          php tests/oneuptime-heartbeat.php
          php tests/github-updater.php
          php tests/posthog-options.php
          php tests/error-log.php
          node tests/tracker-js.js
      - name: Build and validate release ZIP
        run: python3 scripts/build-release.py
      - name: Install WordPress
        run: |
          curl -fsSLo /tmp/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp
          /tmp/wp core download --version=${{ matrix.wordpress }} --path=/tmp/arcwind-wp
          /tmp/wp config create --path=/tmp/arcwind-wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          /tmp/wp core install --path=/tmp/arcwind-wp --url=http://localhost --title='ArcWind CI' --admin_user=admin --admin_password=example-password --admin_email=admin@example.test
      - name: Upgrade from a previous release
        if: matrix.php == '8.3' && matrix.wordpress == 'latest'
        run: |
          curl -fsSLo /tmp/arcwind-old.zip https://github.com/ArcWindAB/WP-Init/releases/download/v1.6.1/arcwind-init.zip
          mkdir -p /tmp/arcwind-old
          unzip -q /tmp/arcwind-old.zip -d /tmp/arcwind-old
          python3 - <<'PY'
          from pathlib import Path
          import re
          import zipfile
          main = Path('/tmp/arcwind-old/arcwind-init/arcwind-init.php')
          text = main.read_text()
          updated, count = re.subn(r'(?m)^(\s*\* Version:\s*)1\.6\.1', r'\g<1>1.6.2', text, count=1)
          if count != 1:
              raise SystemExit('Could not create the synthetic 1.6.2 upgrade fixture')
          main.write_text(updated)
          root = main.parent.parent
          with zipfile.ZipFile('/tmp/arcwind-old-1.6.2.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for file in sorted(main.parent.rglob('*')):
                  if file.is_file():
                      archive.write(file, file.relative_to(root))
          PY
          /tmp/wp plugin install /tmp/arcwind-old-1.6.2.zip --activate --path=/tmp/arcwind-wp
          /tmp/wp option update arcwind_init_settings '{"public_api_key":"phc_placeholder","feedback_uuid":"TEST1234","feedback_enabled":1}' --format=json --path=/tmp/arcwind-wp
      - name: Install current build and smoke test
        run: |
          /tmp/wp plugin install "$GITHUB_WORKSPACE/dist/arcwind-init.zip" --activate --force --path=/tmp/arcwind-wp
          ARCWIND_EXPECT_UPGRADE=${{ matrix.php == '8.3' && matrix.wordpress == 'latest' && '1' || '' }} /tmp/wp eval-file "$GITHUB_WORKSPACE/tests/wp-smoke.php" --path=/tmp/arcwind-wp
          /tmp/wp option update home http://127.0.0.1:18888 --path=/tmp/arcwind-wp
          /tmp/wp option update siteurl http://127.0.0.1:18888 --path=/tmp/arcwind-wp
          php -S 127.0.0.1:18888 -t /tmp/arcwind-wp >/tmp/arcwind-wp-server.log 2>&1 &
          sleep 1
          mkdir -p /tmp/arcwind-wp/wp-content/mu-plugins
          cp "$GITHUB_WORKSPACE/tests/wp-offline-fixture.php" /tmp/arcwind-wp/wp-content/mu-plugins/arcwind-offline-fixture.php
          /tmp/wp eval-file "$GITHUB_WORKSPACE/tests/wp-http-failure-setup.php" --path=/tmp/arcwind-wp
          bash "$GITHUB_WORKSPACE/tests/wp-admin-pages.sh"
          /tmp/wp eval-file "$GITHUB_WORKSPACE/tests/wp-updater-smoke.php" --path=/tmp/arcwind-wp
          bash "$GITHUB_WORKSPACE/tests/wp-admin-pages.sh"
          if [ '${{ matrix.php }}' = '8.3' ] && [ '${{ matrix.wordpress }}' = 'latest' ]; then
            bash "$GITHUB_WORKSPACE/tests/wp-module-failure.sh"
          fi
          /tmp/wp plugin deactivate arcwind-init --path=/tmp/arcwind-wp
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') && matrix.php == '8.3' && matrix.wordpress == 'latest'
        with:
          name: arcwind-init-release
          path: dist/arcwind-init.zip
