name: Build WordPress plugin release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build and validate installable archive
        run: python3 scripts/build-release.py --tag '${{ github.event.release.tag_name }}'
      - name: Upload archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/arcwind-init.zip --clobber
